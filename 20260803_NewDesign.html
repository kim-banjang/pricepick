<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PricePick 시안 — 20260803</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #14151a;
    display: flex;
    flex-direction: column;
  }
  header {
    flex: 0 0 auto;
    background: #1c1d24;
    border-bottom: 1px solid #2c2d36;
  }
  .tabs {
    display: flex;
    gap: 4px;
    padding: 10px 12px 0;
  }
  .tab {
    appearance: none;
    border: none;
    background: transparent;
    color: #8a8b96;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 10px 10px 0 0;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .tab:hover { color: #d6d7e0; }
  .tab.active {
    background: #f5f5f7;
    color: #14151a;
  }
  .frame-wrap {
    position: relative;
    flex: 1 1 auto;
    background: #f5f5f7;
  }
  iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #f5f5f7;
    display: none;
  }
  iframe.active { display: block; }
  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #a9aab4;
    font-size: 13px;
  }
  .placeholder.hidden { display: none; }
</style>
</head>
<body>
  <header>
    <div class="tabs">
      <button class="tab active" data-target="invite">친구초대</button>
      <button class="tab" data-target="ticket">티켓 교환</button>
    </div>
  </header>
  <div class="frame-wrap">
    <div id="ph-invite" class="placeholder">불러오는 중...</div>
    <div id="ph-ticket" class="placeholder hidden">불러오는 중...</div>
    <iframe id="frame-invite" class="active" src="20260803_NewDesign_invite.html" title="친구초대 시안"></iframe>
    <iframe id="frame-ticket" title="티켓 교환 시안"></iframe>
  </div>

  <script>
    var TICKET_SRC = '20260803_NewDesign_ticket.html';
    var tabs = document.querySelectorAll('.tab');
    var frames = {
      invite: document.getElementById('frame-invite'),
      ticket: document.getElementById('frame-ticket')
    };
    var placeholders = {
      invite: document.getElementById('ph-invite'),
      ticket: document.getElementById('ph-ticket')
    };

    frames.invite.addEventListener('load', function () {
      placeholders.invite.classList.add('hidden');
    });
    frames.ticket.addEventListener('load', function () {
      placeholders.ticket.classList.add('hidden');
    });

    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        var target = tab.getAttribute('data-target');
        if (tab.classList.contains('active')) return;

        tabs.forEach(function (t) { t.classList.remove('active'); });
        tab.classList.add('active');

        Object.keys(frames).forEach(function (key) {
          frames[key].classList.toggle('active', key === target);
        });

        if (target === 'ticket' && !frames.ticket.src) {
          frames.ticket.src = TICKET_SRC;
        } else {
          placeholders[target].classList.add('hidden');
        }
      });
    });
  </script>
</body>
</html>
