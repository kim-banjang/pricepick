<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PricePick 시안 통합본</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #14151a;
    display: flex;
    flex-direction: column;
  }
  header {
    flex: 0 0 auto;
    background: #1c1d24;
    border-bottom: 1px solid #2c2d36;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 12px 0;
  }
  .tabs {
    display: flex;
    gap: 4px;
    flex: 1 1 auto;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .tab {
    appearance: none;
    border: none;
    background: transparent;
    color: #8a8b96;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 10px 10px 0 0;
    cursor: pointer;
    white-space: nowrap;
    flex: 0 0 auto;
    transition: background .15s ease, color .15s ease;
  }
  .tab:hover { color: #d6d7e0; }
  .tab.active {
    background: #f5f5f7;
    color: #14151a;
  }
  .lang-toggle {
    appearance: none;
    border: none;
    display: inline-flex;
    align-items: center;
    gap: 0;
    background: #2c2d36;
    border-radius: 999px;
    padding: 3px;
    cursor: pointer;
    flex: 0 0 auto;
    margin-bottom: 8px;
  }
  .lang-toggle span {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .4px;
    color: #8a8b96;
    padding: 5px 12px;
    border-radius: 999px;
    line-height: 1.4;
    transition: background .15s, color .15s;
  }
  .lang-toggle span.on { background: #845EEE; color: #fff; }
  .frame-wrap {
    position: relative;
    flex: 1 1 auto;
    background: #f5f5f7;
  }
  iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #f5f5f7;
    display: none;
  }
  iframe.active { display: block; }
  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #a9aab4;
    font-size: 13px;
    z-index: 1;
  }
  .placeholder.hidden { display: none; }
</style>
</head>
<body>
  <header>
    <div class="tabs">
      <button class="tab active" data-target="splash">스플래시·로그인</button>
      <button class="tab" data-target="attendance">출석체크</button>
      <button class="tab" data-target="jackpot">잭팟 룰렛</button>
      <button class="tab" data-target="lucky">행운 룰렛</button>
      <button class="tab" data-target="friend">친구초대</button>
      <button class="tab" data-target="mission">연속구매 미션</button>
      <button class="tab" data-target="ticket">티켓 교환</button>
      <button class="tab" data-target="mytickets">내 티켓 &amp; 포인트</button>
      <button class="tab" data-target="giftbox">매일선물상자, 랜덤선물상자 열기</button>
    </div>
    <button id="lang-toggle" class="lang-toggle" data-lang="ko" type="button" title="KO / VI" aria-label="KO/VI">
      <span data-l="ko" class="on">KO</span><span data-l="vi">VI</span>
    </button>
  </header>
  <div class="frame-wrap">
    <div id="ph-splash" class="placeholder">불러오는 중...</div>
    <div id="ph-lm" class="placeholder hidden">불러오는 중...</div>
    <div id="ph-jackpot" class="placeholder hidden">불러오는 중...</div>
    <div id="ph-invite" class="placeholder hidden">불러오는 중...</div>
    <div id="ph-streak" class="placeholder hidden">불러오는 중...</div>
    <div id="ph-ticket" class="placeholder hidden">불러오는 중...</div>
    <div id="ph-mytickets" class="placeholder hidden">불러오는 중...</div>
    <div id="ph-giftbox" class="placeholder hidden">불러오는 중...</div>
    <iframe id="frame-splash" class="active" src="design-splash-login-20260729.html" title="스플래시·로그인 시안"></iframe>
    <iframe id="frame-lm" title="출석체크 / 행운 룰렛 시안"></iframe>
    <iframe id="frame-jackpot" title="잭팟 룰렛 시안"></iframe>
    <iframe id="frame-invite" title="친구초대 시안"></iframe>
    <iframe id="frame-streak" title="연속구매 미션 시안"></iframe>
    <iframe id="frame-ticket" title="티켓 교환 시안"></iframe>
    <iframe id="frame-mytickets" title="내 티켓 & 포인트 시안"></iframe>
    <iframe id="frame-giftbox" title="매일선물상자, 랜덤선물상자 열기 시안"></iframe>
  </div>

  <script>
    var SRC = {
      lm: '20260729_NewDesign.html',
      jackpot: '20260731_NewDesign.html',
      invite: '20260803_NewDesign_invite.html',
      streak: '20260803_NewDesign_streak.html',
      ticket: '20260803_NewDesign_ticket.html',
      mytickets: '20260804_NewDesign_mytickets.html',
      giftbox: '20260825_NewDesign_giftbox.html'
    };

    var FRAME_OF_TAB = {
      splash: 'frame-splash',
      attendance: 'frame-lm',
      lucky: 'frame-lm',
      jackpot: 'frame-jackpot',
      friend: 'frame-invite',
      mission: 'frame-streak',
      ticket: 'frame-ticket',
      mytickets: 'frame-mytickets',
      giftbox: 'frame-giftbox'
    };
    var PLACEHOLDER_OF_FRAME = {
      'frame-splash': 'ph-splash',
      'frame-lm': 'ph-lm',
      'frame-jackpot': 'ph-jackpot',
      'frame-invite': 'ph-invite',
      'frame-streak': 'ph-streak',
      'frame-ticket': 'ph-ticket',
      'frame-mytickets': 'ph-mytickets',
      'frame-giftbox': 'ph-giftbox'
    };

    var frames = {};
    ['frame-splash', 'frame-lm', 'frame-jackpot', 'frame-invite', 'frame-streak', 'frame-ticket', 'frame-mytickets', 'frame-giftbox'].forEach(function (id) {
      frames[id] = document.getElementById(id);
    });
    var placeholders = {};
    Object.keys(PLACEHOLDER_OF_FRAME).forEach(function (fid) {
      placeholders[fid] = document.getElementById(PLACEHOLDER_OF_FRAME[fid]);
    });

    // ── 20260729_NewDesign.html(출석·룰렛) 내부 구조 ──
    //   container = #dc-root > .sc-host > div > div:nth-child(2)
    //   container.children[0] = 01 행운룰렛, [1] = 02 출석체크,
    //   [2].children[0] = 03 룰렛 결과 모달(행운룰렛에 포함), [2].children[1] = 04 출석체크 결과 모달(출석체크에 포함)
    var LM_CONTAINER_SELECTOR = '#dc-root > .sc-host > div > div:nth-child(2)';
    function applyLmSection(doc, target) {
      var c = doc.querySelector(LM_CONTAINER_SELECTOR);
      if (!c || c.children.length < 3) return false;
      var resultWrap = c.children[2];
      if (!resultWrap || resultWrap.children.length < 2) return false;
      var sec01 = c.children[0], sec02 = c.children[1];
      var sec03 = resultWrap.children[0], sec04 = resultWrap.children[1];
      sec01.style.display = (target === 'lucky') ? '' : 'none';
      sec03.style.display = (target === 'lucky') ? '' : 'none';
      sec02.style.display = (target === 'attendance') ? '' : 'none';
      sec04.style.display = (target === 'attendance') ? '' : 'none';
      return true;
    }
    // 07-29 파일은 행운룰렛/출석체크 두 탭이 문서 하나(헤더 하나)를 공유한다.
    // 파일 자체는 건드리지 않고, 탭 전환 시 wrapper가 헤더 3단(아이브로우/타이틀/리드)의
    // 텍스트+스타일을 정본 규격(ticket.html 실측치)으로 갈아끼운다. .i18n/.ko/.vi 구조를
    // 그대로 유지해서 기존 KO/VI 토글 CSS(#langsw:checked ~ ...)가 계속 먹히게 한다.
    var LM_HEADER_SELECTOR = '#dc-root > .sc-host > div > div:nth-child(1)';
    var HEADER_STYLE = {
      eyebrow: 'font-size:13px;font-weight:700;letter-spacing:.08em;color:#9B93B0',
      title: 'font-size:34px;font-weight:800;letter-spacing:-.035em;color:#1A1130',
      lead: 'font-size:15px;font-weight:500;color:#8A8AA3'
    };
    var LM_HEADER_CONTENT = {
      lucky: {
        eyebrow: { ko: 'PRICEPICK · 행운 룰렛', vi: 'PRICEPICK · Vòng quay may mắn' },
        title: { ko: '행운 룰렛 New Design', vi: 'Vòng quay may mắn New Design' },
        lead: { ko: '행운 룰렛 화면과 결과 모달을 모았습니다', vi: 'Gộp màn hình Vòng quay may mắn và modal kết quả' }
      },
      attendance: {
        eyebrow: { ko: 'PRICEPICK · 출석체크', vi: 'PRICEPICK · Điểm danh' },
        title: { ko: '출석체크 New Design', vi: 'Điểm danh New Design' },
        lead: { ko: '출석체크 화면과 결과 모달을 모았습니다', vi: 'Gộp màn hình Điểm danh và modal kết quả' }
      }
    };
    function applyLmHeader(doc, target) {
      var header = doc.querySelector(LM_HEADER_SELECTOR);
      if (!header || header.children.length < 3) return false;
      var content = LM_HEADER_CONTENT[target];
      if (!content) return false;
      ['eyebrow', 'title', 'lead'].forEach(function (part, i) {
        var div = header.children[i];
        div.setAttribute('style', HEADER_STYLE[part]);
        div.innerHTML = '<span class="i18n"><span class="ko">' + content[part].ko + '</span><span class="vi">' + content[part].vi + '</span></span>';
      });
      return true;
    }

    // 07-29 파일 내부의 페이지 전환 네비("출석·룰렛"/"스플래시·로그인" 링크)는 wrapper 탭으로
    // 대체되므로 숨긴다. 언어 토글(.pp-langtog 등 각 파일 자체 UI)은 더 이상 숨기지 않는다 —
    // 개별 파일을 직접 열었을 때도 KO/VI 전환이 보여야 하기 때문(문서 참고: 토글은
    // "개별 파일 자체 UI" + "통합본 상단 UI" 두 곳에 있고, 통합본 쪽이 #langsw를 원격 제어한다).
    function hideInternalChrome(doc) {
      var els = doc.querySelectorAll('.pp-pagetog');
      els.forEach(function (el) { el.style.display = 'none'; });
    }

    var frameState = {}; // frameId -> {ready: bool, pendingTarget: string}
    Object.keys(frames).forEach(function (id) { frameState[id] = { ready: false, pendingTarget: null }; });

    function applySectionForFrame(frameId, target) {
      var doc;
      try { doc = frames[frameId].contentDocument; } catch (e) { doc = null; }
      if (!doc) return;
      if (frameId === 'frame-lm') {
        applyLmSection(doc, target);
        applyLmHeader(doc, target);
      }
    }

    function whenFrameReady(frameId, checkFn, onReady) {
      var tries = 0;
      var iv = setInterval(function () {
        tries++;
        var doc;
        try { doc = frames[frameId].contentDocument; } catch (e) { doc = null; }
        var ok = doc && checkFn(doc);
        if (ok || tries > 80) {
          clearInterval(iv);
          onReady(doc);
        }
      }, 200);
    }

    function onFrameLoaded(frameId, needsSectionSplit) {
      // #langsw는 각 시안 파일의 내부 i18n 스크립트가 콘텐츠 안정화 후 만들어낸다.
      // 이 시점이 곧 .pp-langtog/.pp-pagetog(있는 경우) 삽입 시점이기도 하므로,
      // 언어 토글 적용 + 내부 UI 숨김 모두 이 신호를 기다렸다가 해야 한다.
      var checkFn = function (doc) {
        // 내 티켓 & 포인트(frame-mytickets)는 아직 자체 언어 토글이 없는 시안이라
        // #langsw를 기다리면 매번 타임아웃까지 헛돌게 된다 — 준비되면 자동으로 반영된다.
        if (frameId !== 'frame-mytickets' && !doc.getElementById('langsw')) return false;
        if (frameId === 'frame-lm') return !!doc.querySelector(LM_CONTAINER_SELECTOR);
        return true;
      };

      whenFrameReady(frameId, checkFn, function (doc) {
        frameState[frameId].ready = true;
        placeholders[frameId].classList.add('hidden');
        if (needsSectionSplit && frameState[frameId].pendingTarget) {
          applySectionForFrame(frameId, frameState[frameId].pendingTarget);
        }
        if (doc) hideInternalChrome(doc);
        // 언어 상태를 방금 로드된 프레임에도 적용
        applyLangToFrame(frameId);
        // React 재렌더 등으로 섹션 표시/내부 UI가 되돌아오는 경우를 대비한 안전망
        observeFrameForReapply(frameId, needsSectionSplit);
      });
    }

    function observeFrameForReapply(frameId, needsSectionSplit) {
      var doc;
      try { doc = frames[frameId].contentDocument; } catch (e) { doc = null; }
      if (!doc || !window.MutationObserver) return;
      var root = doc.getElementById('dc-root') || doc.body;
      if (!root) return;
      var obs = new MutationObserver(function () {
        // applySectionForFrame(frame-lm)이 헤더 innerHTML을 다시 쓰므로, 그 자체가 만드는
        // childList 변형을 이 옵저버가 다시 감지해 무한 루프에 빠지지 않도록 잠깐 끊는다.
        obs.disconnect();
        if (needsSectionSplit && frameState[frameId].pendingTarget) {
          applySectionForFrame(frameId, frameState[frameId].pendingTarget);
        }
        hideInternalChrome(doc);
        obs.observe(root, { childList: true, subtree: true });
      });
      obs.observe(root, { childList: true, subtree: true });
    }

    frames['frame-splash'].addEventListener('load', function () { onFrameLoaded('frame-splash', false); });
    frames['frame-lm'].addEventListener('load', function () { onFrameLoaded('frame-lm', true); });
    frames['frame-jackpot'].addEventListener('load', function () { onFrameLoaded('frame-jackpot', false); });
    frames['frame-invite'].addEventListener('load', function () { onFrameLoaded('frame-invite', false); });
    frames['frame-streak'].addEventListener('load', function () { onFrameLoaded('frame-streak', false); });
    frames['frame-ticket'].addEventListener('load', function () { onFrameLoaded('frame-ticket', false); });
    frames['frame-mytickets'].addEventListener('load', function () { onFrameLoaded('frame-mytickets', false); });
    frames['frame-giftbox'].addEventListener('load', function () { onFrameLoaded('frame-giftbox', false); });

    // ── 언어 토글: 합본 상단 단일 토글이 로드된 모든 iframe의 #langsw checkbox를 구동 ──
    var LANG_KEY = 'pp_0803_lang';
    var currentLang = localStorage.getItem(LANG_KEY) === 'vi' ? 'vi' : 'ko';

    function applyLangToFrame(frameId) {
      var doc;
      try { doc = frames[frameId].contentDocument; } catch (e) { doc = null; }
      if (!doc) return;
      var cb = doc.getElementById('langsw');
      if (!cb) return;
      var wantVi = (currentLang === 'vi');
      if (cb.checked === wantVi) return;
      cb.checked = wantVi;
      var evt;
      try { evt = new Event('change', { bubbles: true }); }
      catch (e) { evt = doc.createEvent('HTMLEvents'); evt.initEvent('change', true, true); }
      cb.dispatchEvent(evt);
    }

    function applyLangToAllLoadedFrames() {
      Object.keys(frames).forEach(function (frameId) {
        if (frameState[frameId].ready) applyLangToFrame(frameId);
      });
    }

    function setLangToggleUI(lang) {
      var t = document.getElementById('lang-toggle');
      t.setAttribute('data-lang', lang);
      var ko = t.querySelector('[data-l="ko"]'), vi = t.querySelector('[data-l="vi"]');
      if (ko) ko.className = (lang === 'ko') ? 'on' : '';
      if (vi) vi.className = (lang === 'vi') ? 'on' : '';
    }
    setLangToggleUI(currentLang);

    document.getElementById('lang-toggle').addEventListener('click', function () {
      currentLang = (currentLang === 'vi') ? 'ko' : 'vi';
      localStorage.setItem(LANG_KEY, currentLang);
      setLangToggleUI(currentLang);
      applyLangToAllLoadedFrames();
    });

    // ── 탭 전환 (지연 로딩: 최초 활성 탭만 즉시 로드, 나머지는 클릭 시점에 src 부여) ──
    var tabs = document.querySelectorAll('.tab');
    var currentFrameId = 'frame-splash';

    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        var target = tab.getAttribute('data-target');
        if (tab.classList.contains('active')) return;

        tabs.forEach(function (t) { t.classList.remove('active'); });
        tab.classList.add('active');

        var frameId = FRAME_OF_TAB[target];
        Object.keys(frames).forEach(function (fid) {
          frames[fid].classList.toggle('active', fid === frameId);
        });
        currentFrameId = frameId;

        var needsSectionSplit = (frameId === 'frame-lm');
        if (needsSectionSplit) frameState[frameId].pendingTarget = target;

        if (!frames[frameId].src) {
          frames[frameId].src = SRC[frameId.replace('frame-', '')];
        } else if (frameState[frameId].ready) {
          placeholders[frameId].classList.add('hidden');
          if (needsSectionSplit) applySectionForFrame(frameId, target);
        }
      });
    });
  </script>
</body>
</html>
