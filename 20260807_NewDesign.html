<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>손질 시안 — 20260807</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #14151a;
    display: flex;
    flex-direction: column;
  }
  header {
    flex: 0 0 auto;
    background: #1c1d24;
    border-bottom: 1px solid #2c2d36;
  }
  .tabs {
    display: flex;
    gap: 4px;
    padding: 10px 12px 0;
  }
  .tab {
    appearance: none;
    border: none;
    background: transparent;
    color: #8a8b96;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 10px 10px 0 0;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .tab:hover { color: #d6d7e0; }
  .tab.active {
    background: #f5f5f7;
    color: #14151a;
  }
  .frame-wrap {
    position: relative;
    flex: 1 1 auto;
    background: #f5f5f7;
  }
  iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #f5f5f7;
    display: none;
  }
  iframe.active { display: block; }
  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #a9aab4;
    font-size: 13px;
    z-index: 1;
  }
  .placeholder.hidden { display: none; }
</style>
</head>
<body>
  <header>
    <div class="tabs">
      <button class="tab active" data-target="interactive">인터랙티브</button>
      <button class="tab" data-target="storyboard">스토리보드</button>
    </div>
  </header>
  <div class="frame-wrap">
    <div id="ph-interactive" class="placeholder">불러오는 중...</div>
    <div id="ph-storyboard" class="placeholder hidden">불러오는 중...</div>
    <iframe id="frame-interactive" class="active" src="20260807_NewDesign_sonjil_interactive.html" title="손질 인터랙티브 시안"></iframe>
    <iframe id="frame-storyboard" title="손질 스토리보드 시안"></iframe>
  </div>

  <script>
    var STORYBOARD_SRC = '20260807_NewDesign_sonjil_storyboard.html';

    var tabs = document.querySelectorAll('.tab');
    var frames = {
      interactive: document.getElementById('frame-interactive'),
      storyboard: document.getElementById('frame-storyboard')
    };
    var placeholders = {
      interactive: document.getElementById('ph-interactive'),
      storyboard: document.getElementById('ph-storyboard')
    };

    frames.interactive.addEventListener('load', function () {
      placeholders.interactive.classList.add('hidden');
    });
    frames.storyboard.addEventListener('load', function () {
      placeholders.storyboard.classList.add('hidden');
    });

    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        var target = tab.getAttribute('data-target');
        if (tab.classList.contains('active')) return;

        tabs.forEach(function (t) { t.classList.remove('active'); });
        tab.classList.add('active');

        Object.keys(frames).forEach(function (key) {
          frames[key].classList.toggle('active', key === target);
        });

        if (target === 'storyboard' && !frames.storyboard.src) {
          frames.storyboard.src = STORYBOARD_SRC;
        } else if (target !== 'storyboard') {
          // no-op, already loaded once
        } else {
          placeholders.storyboard.classList.add('hidden');
        }
      });
    });
  </script>
</body>
</html>
