*{box-sizing:border-box;margin:0;padding:0} body{font-family:-apple-system,'Apple SD Gothic Neo',Pretendard,sans-serif;color:var(--ink1);background:var(--bg);line-height:1.55}

.tbl tr.dif td.k::before{content:"◆ ";font-size:9px;vertical-align:1px}
.s{font-size:9.5px;font-weight:800;color:var(--pp);vertical-align:super;margin-left:2px}

.src{margin-top:12px;font-size:11.2px;color:var(--ink3);line-height:1.85}

.foot{margin-top:12px;font-size:11.2px;color:var(--ink3)}
.vi{display:none}
#langsw{position:absolute;opacity:0;pointer-events:none}
#langsw:checked ~ header .ko, #langsw:checked ~ .wrap .ko{display:none}
#langsw:checked ~ header .vi, #langsw:checked ~ .wrap .vi{display:inline}
.langtog{display:inline-flex;background:rgba(255,255,255,.18);border-radius:20px;padding:3px;gap:2px;cursor:pointer;position:absolute;top:17px;right:22px}
.langtog .seg{font-size:11.5px;font-weight:700;color:#fff;padding:3px 12px;border-radius:16px;opacity:.7}
.langtog .sk{background:#fff;color:var(--pp-d);opacity:1}
#langsw:checked ~ header .langtog .sk{background:none;color:#fff;opacity:.7}
#langsw:checked ~ header .langtog .sv{background:#fff;color:var(--pp-d);opacity:1}
a{color:var(--pp-d);font-weight:700}
