<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프라이스픽 쇼핑 가이드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css">
<style>
:root{
  --main:#845EEE; --main-dark:#6C4AB6; --sub-1:#9B78FF; --sub-2:#C6AFFF; --sub-3:#E2D9FF; --sub-4:#F1EEFF;
  --bg:#FAFAFA; --card:#FFFFFF; --text1:#1A1130; --text2:#5A5370; --text3:#9B93B0; --border:#EEEAF3; --green:#22C55E;
  --r:12px; --r-lg:16px; --r-xl:20px;
  --dim:rgba(26,17,48,.92);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#ECECF0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--text1);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 48px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* 상단 탭 (프레임 바깥) */
.tabs{display:flex;gap:4px;padding:4px;background:#fff;border:1px solid #E2E2E8;border-radius:999px;margin-bottom:24px}
.tabs button{height:40px;padding:0 20px;border-radius:999px;font-size:14px;font-weight:600;color:var(--text2);transition:background .2s,color .2s}
.tabs button.on{background:var(--text1);color:#fff}

/* 아이폰 프레임 */
.phone{width:395px;height:832px;padding:10px;border-radius:56px;background:#1B1B1F;box-shadow:0 0 0 1px #2E2E33 inset,0 24px 60px rgba(26,17,48,.18);flex:none}
.screen{position:relative;width:375px;height:812px;border-radius:46px;overflow:hidden;background:var(--bg)}
.panel[hidden]{display:none}
@media (max-width:420px){
  body{padding:16px 0 32px;overflow-x:hidden}
  .phone{transform:scale(calc((100vw - 8px) / 395px));transform-origin:top center;margin-bottom:calc((100vw - 403px) * 2.1)}
}

.status{position:absolute;top:0;left:0;right:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font-size:15px;font-weight:600;z-index:30;pointer-events:none;color:var(--text1);transition:color .2s}
.status.light{color:#fff}
.status .icons{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:11px;left:50%;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#000;z-index:31}
.homebar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--text1);z-index:31;transition:background .2s}
.homebar.light{background:#fff}

/* 쇼핑 가이드 페이지 */
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-top:47px;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.appbar{position:sticky;top:0;z-index:5;height:52px;display:flex;align-items:center;gap:2px;padding:0 12px 0 6px;background:rgba(250,250,250,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.appbar .back{width:40px;height:40px;display:grid;place-items:center;color:var(--text1)}
.appbar h1{font-size:17px;font-weight:700}
.head{padding:12px 20px 0}
.head h2{font-size:22px;font-weight:700;line-height:1.4;letter-spacing:-.3px;word-break:keep-all}
.head p{margin-top:8px;font-size:14px;color:var(--text3)}

.overview{display:block;width:calc(100% - 32px);margin:24px 16px 0;padding:18px 16px 20px;border-radius:var(--r-xl);background:#1A1130;text-align:left;color:#fff;transition:transform .15s}
.overview:active{transform:scale(.985)}
.overview .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.overview .top b{font-size:16px;font-weight:700}
.overview .top span{display:flex;align-items:center;gap:2px;font-size:12px;color:rgba(255,255,255,.6)}

/* 7장 흐름도 (공용) */
.flow{display:flex;flex-direction:column;gap:12px}
.flow .row{display:flex;align-items:center;justify-content:center}
.flow .node{position:relative;flex:none}
.flow .node img{display:block;width:100%;height:100%;object-fit:cover;border-radius:12px}
.flow .node i{position:absolute;left:-5px;top:-5px;width:20px;height:20px;border-radius:50%;background:var(--main);color:#fff;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px #1A1130}
.flow .arrow{flex:none;width:18px;display:grid;place-items:center;color:rgba(255,255,255,.4)}
.flow .node{width:56px;height:56px}

.steps{padding:24px 16px 48px;display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:14px;align-items:center;width:100%;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);text-align:left;transition:transform .15s}
.step:active{transform:scale(.985)}
.step img{flex:none;width:72px;height:72px;border-radius:var(--r);object-fit:cover;background:var(--sub-4)}
.step .tx{min-width:0}
.step .no{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--sub-4);color:var(--main);font-size:12px;font-weight:700}
.step b{display:block;margin-top:6px;font-size:15px;font-weight:700;line-height:1.4;word-break:keep-all}
.step p{margin-top:2px;font-size:13px;line-height:1.5;color:var(--text2);word-break:keep-all}

/* 가이드 투어 오버레이 */
.tour{position:absolute;inset:0;z-index:20;background:var(--dim);color:#fff;display:flex;flex-direction:column;padding-top:47px;opacity:0;pointer-events:none;transition:opacity .25s;cursor:pointer;user-select:none}
.tour.open{opacity:1;pointer-events:auto}
.tour .bar{display:flex;align-items:center;gap:12px;padding:12px 12px 0 20px}
.tour .prog{flex:1;display:flex;gap:4px}
.tour .prog span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.25);transition:background .3s}
.tour .prog span.done{background:#fff}
.tour .x{width:36px;height:36px;display:grid;place-items:center;color:#fff}
.tour .skip{align-self:flex-start;margin:2px 0 0 12px;height:36px;padding:0 8px;font-size:14px;font-weight:500;color:rgba(255,255,255,.72)}
.tour .skip.hide{visibility:hidden}

.tour .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 28px 12px;text-align:center}
.tour .art{width:260px;height:260px;border-radius:24px;object-fit:cover;box-shadow:0 18px 48px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.2)}
.tour h3{margin-top:36px;font-size:22px;font-weight:700;line-height:1.4;word-break:keep-all}
.tour .desc{margin-top:10px;font-size:15px;font-weight:400;line-height:1.55;color:rgba(255,255,255,.72);word-break:keep-all}
.tour .more{margin:0 auto 52px;height:40px;padding:0 8px;font-size:14px;color:rgba(255,255,255,.7);text-decoration:underline;text-underline-offset:3px}
.tour .fade{animation:fadeUp 320ms cubic-bezier(.2,.7,.3,1) both}
.tour .fade.d1{animation-delay:40ms}
.tour .fade.d2{animation-delay:80ms}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.tour .final{display:none;flex:1;flex-direction:column;padding:0 20px 44px;cursor:default}
.tour.is-final .final{display:flex}
.tour.is-final .stage,.tour.is-final .more{display:none}
.tour .stage{flex:1;display:flex;flex-direction:column}
.tour .final h3{margin-top:28px;text-align:center}
.tour .final .flow{flex:1;justify-content:center;gap:18px}
.tour .final .flow .node{width:68px;height:68px}
.tour .final .flow .node i{box-shadow:0 0 0 2px #241a3a}
.tour .final .flow .arrow{width:16px;color:rgba(255,255,255,.45)}
.tour .btns{display:flex;gap:8px}
.tour .btns button{flex:1;height:54px;border-radius:var(--r-lg);font-size:16px;font-weight:700}
.tour .btns .ghost{border:1.5px solid rgba(255,255,255,.45);color:#fff}
.tour .btns .fill{background:var(--main);color:#fff}
.tour .btns .fill:active{background:var(--main-dark)}

@media (prefers-reduced-motion:reduce){.tour .fade{animation:none}}
</style>
</head>
<body>

<div class="tabs" role="tablist">
  <button role="tab" class="on" data-tab="a">가이드 투어</button>
  <button role="tab" data-tab="b">쇼핑 가이드 페이지</button>
</div>

<div class="phone">
  <div class="screen" id="screenA" data-panel="a"></div>
  <div class="screen panel" id="screenB" data-panel="b" hidden></div>
</div>

<template id="tpl">
  <div class="island"></div>
  <div class="status"><span>9:41</span><span class="icons">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.3c2.3 0 4.4.9 6 2.4l1.1-1.1A10 10 0 0 0 8 .7 10 10 0 0 0 .9 3.6L2 4.7a8.5 8.5 0 0 1 6-2.4Zm0 3.2c1.4 0 2.7.5 3.7 1.4l1.1-1.1A6.9 6.9 0 0 0 8 3.9a6.9 6.9 0 0 0-4.8 1.9l1.1 1.1c1-.9 2.3-1.4 3.7-1.4Zm0 3.2c-.6 0-1.2.2-1.6.6L8 11l1.6-1.7c-.4-.4-1-.6-1.6-.6Z"/></svg>
    <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="19" height="8" rx="2" fill="currentColor"/><path d="M24 4v4c.8-.3 1.3-1 1.3-2s-.5-1.7-1.3-2Z" fill="currentColor" opacity=".4"/></svg>
  </span></div>

  <div class="page">
    <div class="appbar">
      <button class="back" aria-label="뒤로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1>쇼핑 가이드</h1>
    </div>
    <div class="head">
      <h2>쓰던 쇼핑몰, 프라이스픽에서 들어가면 티켓이 쌓여요</h2>
      <p>처음이라면 위에서부터 차례로 읽어 보세요</p>
    </div>
    <button class="overview" data-act="overview">
      <div class="top"><b>한눈에 보는 프라이스픽</b><span>누르면 처음부터 봐요<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span></div>
      <div class="flow" data-flow></div>
    </button>
    <div class="steps" data-steps></div>
  </div>

  <div class="tour" data-tour>
    <div class="bar">
      <div class="prog" data-prog></div>
      <button class="x" data-act="close" aria-label="닫기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <button class="skip" data-act="skip">건너뛰기</button>
    <div class="stage">
      <div class="body">
        <img class="art" data-art alt="">
        <h3 data-title></h3>
        <p class="desc" data-desc></p>
      </div>
    </div>
    <button class="more" data-act="more">가이드 자세히 보기 ›</button>
    <div class="final" data-final>
      <h3 class="fade">한눈에 보는 프라이스픽</h3>
      <div class="flow fade d1" data-flow></div>
      <div class="btns fade d2">
        <button class="ghost" data-act="replay">다시 보기</button>
        <button class="fill" data-act="start">시작하기</button>
      </div>
    </div>
  </div>

  <div class="homebar"></div>
</template>

<script>
const STEPS = [
  ['프라이스픽에서 출발해요', '쇼핑하기 전에 프라이스픽을 먼저 열어요'],
  ["제휴몰에서 '쇼핑하기'를 눌러요", '열린 창에서 평소처럼 결제하면 돼요'],
  ['상품은 집으로 오고', '프라이스픽에는 티켓이 쌓여요'],
  ['쌓인 티켓은 사용 대기예요', '반품·취소 기간이 지나야 확정돼요'],
  ['확정되면 바로 쓸 수 있어요', '티켓이 사용 가능 상태로 바뀌어요'],
  ['포인트 10P는 티켓 1장이 돼요', '출석·선물 상자·친구 초대로 포인트를 모아요'],
  ['티켓으로 기프티콘을 사요', '커피·편의점 기프티콘을 바로 받아요'],
];
const art = i => `guide-art/s${i + 1}.png`;
STEPS.forEach((_, i) => { const im = new Image(); im.src = art(i); });

const ARROW = '<span class="arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>';
function flowHTML() {
  const node = i => `<span class="node"><img src="${art(i)}" alt=""><i>${i + 1}</i></span>`;
  const row = ids => `<div class="row">${ids.map(node).join(ARROW)}</div>`;
  return row([0, 1, 2, 3]) + row([4, 5, 6]);
}

function mount(screen, startOpen) {
  screen.appendChild(document.getElementById('tpl').content.cloneNode(true));
  const $ = s => screen.querySelector(s);
  const tour = $('[data-tour]'), status = $('.status'), home = $('.homebar');
  screen.querySelectorAll('[data-flow]').forEach(el => el.innerHTML = flowHTML());
  $('[data-prog]').innerHTML = STEPS.map(() => '<span></span>').join('');
  $('[data-steps]').innerHTML = STEPS.map(([t, d], i) =>
    `<button class="step" data-go="${i}"><img src="${art(i)}" alt=""><span class="tx"><span class="no">${i + 1}</span><b>${t}</b><p>${d}</p></span></button>`).join('');

  let idx = 0;
  const bars = [...screen.querySelectorAll('[data-prog] span')];
  const replay = els => els.forEach(el => { el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade'); });

  function show(i) {
    idx = i;
    const final = i >= STEPS.length;
    tour.classList.toggle('is-final', final);
    $('.skip').classList.toggle('hide', final);
    bars.forEach((b, k) => b.classList.toggle('done', final || k <= i));
    if (final) { replay([...screen.querySelectorAll('[data-final] > *')]); return; }
    const im = $('[data-art]'), t = $('[data-title]'), d = $('[data-desc]');
    im.src = art(i); t.textContent = STEPS[i][0]; d.textContent = STEPS[i][1];
    replay([im, t, d]);
    t.classList.add('d1'); d.classList.add('d2');
  }
  function open(i = 0) {
    show(i); tour.classList.add('open');
    status.classList.add('light'); home.classList.add('light');
  }
  function close() {
    tour.classList.remove('open');
    status.classList.remove('light'); home.classList.remove('light');
  }

  tour.addEventListener('click', e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'close' || act === 'start' || act === 'more') return close();
    if (act === 'skip') return show(STEPS.length);
    if (act === 'replay') return show(0);
    if (idx < STEPS.length) show(idx + 1);
  });
  $('[data-act="overview"]').addEventListener('click', () => open(0));
  screen.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => open(+b.dataset.go)));

  if (startOpen) open(0);
  return { open, close };
}

const A = mount(document.getElementById('screenA'), true);
mount(document.getElementById('screenB'), false);

document.querySelectorAll('.tabs button').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b === btn));
  document.querySelectorAll('.screen').forEach(s => s.hidden = s.dataset.panel !== btn.dataset.tab);
  if (btn.dataset.tab === 'a') A.open(0);
}));
</script>
</body>
</html>
